# Automatyczne wdrożenie aplikacji Vite na GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Uruchamiaj po każdym pushu do gałęzi main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          # Ustawiamy base na nazwę repozytorium (wymagane dla GitHub Pages)
          # Jeśli Twoje repozytorium nazywa się 'deal-spot', usuń "/" przed i za nazwą.
          # Najlepiej zostawić "/" jeśli używasz domeny niestandardowej.
          VITE_BASE_URL: /${{ github.event.repository.name }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
